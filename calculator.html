<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AES Calculator</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8ecf8;background:radial-gradient(900px 500px at 15% -10%,#1d2a63 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#0e4a52 0,transparent 55%),#0a0f1f}
.wrap{max-width:820px;margin:0 auto;padding:28px 16px 48px}
header{text-align:center;margin-bottom:22px;position:relative}
h1{margin:0;font-size:clamp(30px,6vw,46px);letter-spacing:-1px}
h1 span{background:linear-gradient(90deg,#6ee7b7,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{color:#9aa6c8;margin:8px 0 0}
.lang{position:absolute;right:0;top:0;display:flex;gap:4px}
.lang button{padding:5px 10px;font-size:12px}
.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:20px;margin-bottom:16px;backdrop-filter:blur(6px)}
label{display:block;font-size:13px;color:#9aa6c8;margin:14px 0 6px}
input,select,textarea{width:100%;background:#0d1530;color:#e8ecf8;border:1px solid #27345f;border-radius:10px;padding:10px 12px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.2)}
textarea{min-height:92px;resize:vertical;font-family:ui-monospace,Consolas,monospace}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.inl{display:flex;gap:8px}
button{cursor:pointer;border:1px solid #27345f;background:#111b3b;color:#e8ecf8;border-radius:10px;padding:10px 14px;font:inherit;white-space:nowrap}
button:hover{border-color:#60a5fa}
button.on{background:#1d2f6b;border-color:#60a5fa}
.tabs{display:flex;gap:8px}.tabs button{flex:1}
.go{background:linear-gradient(90deg,#34d399,#60a5fa);color:#06101f;font-weight:700;border:0;flex:1}
small{display:block;color:#7f8cb0;margin-top:6px;font-family:ui-monospace,Consolas,monospace;word-break:break-all}
h2{margin:0 0 10px;font-size:18px}
.mono{font-family:ui-monospace,Consolas,monospace;word-break:break-all;background:#0d1530;border:1px solid #27345f;border-radius:10px;padding:12px;margin-bottom:10px}
.err{color:#fca5a5;margin-top:12px}.ok{color:#6ee7b7;margin-top:8px}
summary{cursor:pointer;font-weight:600}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.step{background:#0d1530;border:1px solid #27345f;border-radius:12px;padding:10px}
.step b{display:block;font-size:12px;color:#6ee7b7;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;font-family:ui-monospace,Consolas,monospace;font-size:13px;text-align:center}
.grid i{font-style:normal;background:#16224a;border-radius:5px;padding:4px 0}
footer{text-align:center;color:#6b7799;font-size:12px;margin-top:20px}
@media(max-width:560px){.row3{grid-template-columns:1fr}.lang{position:static;justify-content:center;margin-bottom:10px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="lang"><button data-l="en" class="on">EN</button><button data-l="uz">UZ</button></div>
  <h1>AES <span>Calculator</span></h1>
  <p data-t="sub"></p>
</header>

<main class="card">
  <div class="tabs"><button id="tE" class="on" data-t="enc"></button><button id="tD" data-t="dec"></button></div>
  <div class="row3">
    <div><label data-t="ks"></label><select id="ks"><option value="128">AES-128</option><option value="192">AES-192</option><option value="256">AES-256</option></select></div>
    <div><label data-t="md"></label><select id="md"><option value="ecb">ECB</option><option value="cbc">CBC</option></select></div>
    <div><label data-t="fm"></label><select id="fmt"><option value="text">Text</option><option value="hex">Hex</option></select></div>
  </div>
  <label data-t="key"></label>
  <div class="inl"><input id="key" autocomplete="off" spellcheck="false"><button id="rk" data-t="rnd"></button></div>
  <small id="keyinfo"></small>
  <div id="ivbox" hidden>
    <label>IV (hex, 32)</label>
    <div class="inl"><input id="iv" autocomplete="off" spellcheck="false"><button id="ri" data-t="rnd"></button></div>
  </div>
  <label id="inlbl"></label>
  <textarea id="inp" spellcheck="false"></textarea>
  <div class="inl" style="margin-top:14px"><button class="go" id="go"></button><button id="tv" data-t="tv"></button></div>
  <div id="err" class="err"></div>
</main>

<section class="card" id="outc" hidden>
  <h2 data-t="res"></h2>
  <div id="out" class="mono"></div>
  <button id="cp" data-t="cp"></button>
  <div id="chk" class="ok"></div>
</section>

<details class="card" id="stc" hidden>
  <summary data-t="stp"></summary>
  <div id="steps" class="steps"></div>
</details>

<footer data-t="foot"></footer>
</div>

<script>
// ---------- CORE: AES (FIPS-197) ----------
const xt=a=>((a<<1)^((a&0x80)?0x1b:0))&255;
const mul=(a,b)=>{let r=0;while(b){if(b&1)r^=a;a=xt(a);b>>=1}return r};
const rot=(x,n)=>((x<<n)|(x>>(8-n)))&255;
const S=new Uint8Array(256),IS=new Uint8Array(256);
for(let x=0;x<256;x++){let v=0;if(x)for(let y=1;y<256;y++)if(mul(x,y)===1){v=y;break}
  const s=v^rot(v,1)^rot(v,2)^rot(v,3)^rot(v,4)^0x63;S[x]=s;IS[s]=x}
function expand(key){
  const Nk=key.length/4,Nr=Nk+6,w=[];let rc=1;
  for(let i=0;i<Nk;i++)w.push(Array.from(key.slice(4*i,4*i+4)));
  for(let i=Nk;i<4*(Nr+1);i++){
    let t=w[i-1].slice();
    if(i%Nk===0){t=[S[t[1]],S[t[2]],S[t[3]],S[t[0]]];t[0]^=rc;rc=xt(rc)}
    else if(Nk>6&&i%Nk===4)t=t.map(b=>S[b]);
    w.push(t.map((b,j)=>b^w[i-Nk][j]));
  }
  const rk=[];for(let r=0;r<=Nr;r++)rk.push(w.slice(4*r,4*r+4).flat());return rk;
}
const add=(s,k)=>s.map((b,i)=>b^k[i]);
const sub=(s,box)=>s.map(b=>box[b]);
function shift(s,inv){const o=new Array(16);
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){const d=inv?(c+r)%4:c,e=inv?c:(c+r)%4;o[r+4*d]=s[r+4*e]}return o}
function mix(s,inv){const m=inv?[14,11,13,9]:[2,3,1,1],o=new Array(16);
  for(let c=0;c<4;c++)for(let r=0;r<4;r++){let v=0;
    for(let k=0;k<4;k++)v^=mul(s[4*c+k],m[(k-r+4)%4]);o[4*c+r]=v}return o}
function encB(b,rk,tr){
  const Nr=rk.length-1;let s=add(Array.from(b),rk[0]);tr&&tr.push(['Round 0 · AddRoundKey',s]);
  for(let r=1;r<=Nr;r++){
    s=sub(s,S);tr&&tr.push([`Round ${r} · SubBytes`,s]);
    s=shift(s,false);tr&&tr.push([`Round ${r} · ShiftRows`,s]);
    if(r<Nr){s=mix(s,false);tr&&tr.push([`Round ${r} · MixColumns`,s])}
    s=add(s,rk[r]);tr&&tr.push([`Round ${r} · AddRoundKey`,s]);
  }return Uint8Array.from(s);
}
function decB(b,rk,tr){
  const Nr=rk.length-1;let s=add(Array.from(b),rk[Nr]);tr&&tr.push([`Round ${Nr} · AddRoundKey`,s]);
  for(let r=Nr-1;r>=0;r--){
    s=shift(s,true);tr&&tr.push([`Round ${r} · InvShiftRows`,s]);
    s=sub(s,IS);tr&&tr.push([`Round ${r} · InvSubBytes`,s]);
    s=add(s,rk[r]);tr&&tr.push([`Round ${r} · AddRoundKey`,s]);
    if(r>0){s=mix(s,true);tr&&tr.push([`Round ${r} · InvMixColumns`,s])}
  }return Uint8Array.from(s);
}
// ---------- END CORE ----------

const T={en:{sub:"Encrypt and decrypt with the Advanced Encryption Standard — and watch every round.",enc:"Encrypt",dec:"Decrypt",ks:"Key size",md:"Mode",fm:"Plaintext format",key:"Key (hex, or any text)",rnd:"Random",tv:"FIPS-197 test",res:"Result",cp:"Copy",stp:"Round-by-round states (first block)",foot:"Educational tool. Runs entirely in your browser — nothing is sent anywhere. Not for protecting real secrets.",run:"Run",pt:"Plaintext",ct:"Ciphertext (hex)",eh:"Invalid hex.",ek:"Enter a key.",ei:"IV must be 32 hex characters.",eb:"Ciphertext must be whole 16-byte blocks.",ep:"Bad padding — wrong key, mode or IV?",okv:"✓ Matches the official FIPS-197 test vector.",bad:"✗ Does not match the test vector.",cd:"Copied!"},
uz:{sub:"Advanced Encryption Standard bilan shifrlash va deshifrlash — har bir raundni ko'ring.",enc:"Shifrlash",dec:"Deshifrlash",ks:"Kalit uzunligi",md:"Rejim",fm:"Matn formati",key:"Kalit (hex yoki oddiy matn)",rnd:"Tasodifiy",tv:"FIPS-197 test",res:"Natija",cp:"Nusxalash",stp:"Raundlar bo'yicha holatlar (birinchi blok)",foot:"O'quv vositasi. Hammasi brauzeringizda ishlaydi, hech narsa yuborilmaydi. Haqiqiy sirlarni himoya qilish uchun emas.",run:"Hisoblash",pt:"Ochiq matn",ct:"Shifrmatn (hex)",eh:"Hex noto'g'ri.",ek:"Kalitni kiriting.",ei:"IV 32 ta hex belgi bo'lishi kerak.",eb:"Shifrmatn 16 baytli bloklardan iborat bo'lishi kerak.",ep:"Padding xato — kalit, rejim yoki IV noto'g'ri?",okv:"✓ Rasmiy FIPS-197 test vektoriga mos keldi.",bad:"✗ Test vektoriga mos kelmadi.",cd:"Nusxalandi!"}};
let L='en',M='E';
const $=id=>document.getElementById(id),t=k=>T[L][k];
const hex=a=>Array.from(a,b=>b.toString(16).padStart(2,'0')).join('');
const unhex=h=>{h=h.replace(/\s+/g,'');if(h.length%2||/[^0-9a-f]/i.test(h))throw new Error(t('eh'));return Uint8Array.from(h.match(/../g)||[],x=>parseInt(x,16))};
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
function ui(){
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  $('go').textContent=t('run');
  $('inlbl').textContent=M==='E'?t('pt'):t('ct');
  $('ivbox').hidden=$('md').value==='ecb';
  $('fmt').parentElement.hidden=false;
}
function getKey(){
  const n=+$('ks').value/8,v=$('key').value.trim();let k;
  if(/^[0-9a-f]+$/i.test(v)&&v.length===n*2)k=unhex(v);
  else{const e=new TextEncoder().encode(v);if(!e.length)throw new Error(t('ek'));k=new Uint8Array(n);k.set(e.slice(0,n))}
  $('keyinfo').textContent='→ '+hex(k);return k;
}
function run(){
  $('err').textContent='';
  try{
    const enc=M==='E',ecb=$('md').value==='ecb',fmt=$('fmt').value,v=$('inp').value;
    const key=getKey(),rk=expand(key);let iv=null;
    if(!ecb){iv=unhex($('iv').value);if(iv.length!==16)throw new Error(t('ei'))}
    let data;
    if(enc){
      const raw=fmt==='text'?new TextEncoder().encode(v):unhex(v),p=16-raw.length%16;
      data=new Uint8Array(raw.length+p);data.set(raw);data.fill(p,raw.length);
    }else{data=unhex(v);if(!data.length||data.length%16)throw new Error(t('eb'))}
    const out=new Uint8Array(data.length),tr=[];let prev=iv;
    for(let i=0;i<data.length;i+=16){
      const blk=data.slice(i,i+16),f=i===0?tr:null;
      if(enc){const x=ecb?blk:blk.map((b,j)=>b^prev[j]),c=encB(x,rk,f);out.set(c,i);prev=c}
      else{const d=decB(blk,rk,f),p=ecb?d:d.map((b,j)=>b^prev[j]);out.set(p,i);prev=blk}
    }
    let res,chk='';
    if(enc){
      res=hex(out);
      if(ecb&&hex(key)==='000102030405060708090a0b0c0d0e0f'&&hex(data.slice(0,16))==='00112233445566778899aabbccddeeff')
        chk=res.startsWith('69c4e0d86a7b0430d8cdb78070b4c55a')?t('okv'):t('bad');
    }else{
      const n=out[out.length-1];
      if(n<1||n>16||out.slice(-n).some(b=>b!==n))throw new Error(t('ep'));
      const raw=out.slice(0,out.length-n);
      res=fmt==='text'?new TextDecoder().decode(raw):hex(raw);
    }
    $('out').textContent=res;$('chk').textContent=chk;$('outc').hidden=false;
    $('steps').innerHTML=tr.map(([n,s])=>`<div class="step"><b>${n}</b><div class="grid">${[0,1,2,3].map(r=>[0,1,2,3].map(c=>`<i>${s[r+4*c].toString(16).padStart(2,'0')}</i>`).join('')).join('')}</div></div>`).join('');
    $('stc').hidden=false;
  }catch(e){$('err').textContent=e.message;$('outc').hidden=true;$('stc').hidden=true}
}
function setMode(m){M=m;$('tE').classList.toggle('on',m==='E');$('tD').classList.toggle('on',m==='D');ui()}
$('tE').onclick=()=>setMode('E');$('tD').onclick=()=>setMode('D');
$('md').onchange=ui;$('go').onclick=run;
$('rk').onclick=()=>{$('key').value=hex(rnd(+$('ks').value/8));getKey()};
$('ri').onclick=()=>{$('iv').value=hex(rnd(16))};
$('ks').onchange=()=>{try{getKey()}catch(e){}};
$('key').oninput=()=>{try{getKey()}catch(e){$('keyinfo').textContent=''}};
$('cp').onclick=()=>navigator.clipboard.writeText($('out').textContent).then(()=>{const b=$('cp'),o=b.textContent;b.textContent=t('cd');setTimeout(()=>b.textContent=o,1200)});
$('tv').onclick=()=>{setMode('E');$('ks').value='128';$('md').value='ecb';$('fmt').value='hex';
  $('key').value='000102030405060708090a0b0c0d0e0f';$('inp').value='00112233445566778899aabbccddeeff';ui();run()};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{L=b.dataset.l;document.querySelectorAll('.lang button').forEach(x=>x.classList.toggle('on',x===b));document.documentElement.lang=L;ui()});
$('iv').value=hex(rnd(16));ui();
</script>
</body>
</html>
