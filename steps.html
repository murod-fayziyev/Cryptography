<script>
// ===== CORE (AES-128) =====
const xt=a=>((a<<1)^((a&0x80)?0x1b:0))&255;
const mul=(a,b)=>{let r=0;while(b){if(b&1)r^=a;a=xt(a);b>>=1}return r};
const rot=(x,n)=>((x<<n)|(x>>(8-n)))&255;
const inv=x=>{if(!x)return 0;for(let y=1;y<256;y++)if(mul(x,y)===1)return y};
const S=new Uint8Array(256);
for(let x=0;x<256;x++){const v=inv(x);S[x]=v^rot(v,1)^rot(v,2)^rot(v,3)^rot(v,4)^0x63}
const rcon=[1,2,4,8,16,32,64,128,0x1b,0x36];
const MM=[[2,3,1,1],[1,2,3,1],[1,1,2,3],[3,1,1,2]];
const add=(s,k)=>s.map((b,i)=>b^k[i]);
function shift(s){const o=new Array(16);for(let r=0;r<4;r++)for(let c=0;c<4;c++)o[r+4*c]=s[r+4*((c+r)%4)];return o}
function mix(s){const o=new Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let v=0;for(let k=0;k<4;k++)v^=mul(s[4*c+k],MM[r][k]);o[4*c+r]=v}return o}
function kexp(key){const w=[];for(let i=0;i<4;i++)w.push(Array.from(key.slice(4*i,4*i+4)));
  for(let i=4;i<44;i++){let t=w[i-1].slice();if(i%4===0){t=[S[t[1]],S[t[2]],S[t[3]],S[t[0]]];t[0]^=rcon[i/4-1]}w.push(t.map((b,j)=>b^w[i-4][j]))}return w}
// Each operation (op) is split into n small parts (n=16 bytes, 4 rows, 4 columns or 4 words)
function build(pt,key){
  const w=kexp(key),rk=r=>w.slice(4*r,4*r+4).flat(),ops=[];let s=Array.from(pt),n;
  ops.push({k:'load',r:0,b:s,a:s,n:1});
  ops.push({k:'key',r:0,n:4});
  n=add(s,rk(0));ops.push({k:'ark',r:0,b:s,a:n,n:16});s=n;
  for(let r=1;r<=10;r++){
    n=s.map(b=>S[b]);ops.push({k:'sub',r,b:s,a:n,n:16});s=n;
    n=shift(s);ops.push({k:'shift',r,b:s,a:n,n:4});s=n;
    if(r<10){n=mix(s);ops.push({k:'mix',r,b:s,a:n,n:4});s=n}
    ops.push({k:'key',r,n:4});
    n=add(s,rk(r));ops.push({k:'ark',r,b:s,a:n,n:16});s=n;
  }
  return {ops,w};
}

const T={

// ===== UI =====
const $=id=>document.getElementById(id),h2=b=>b.toString(16).padStart(2,'0'),hx=a=>a.map(h2).join(' '),bin=b=>b.toString(2).padStart(8,'0'),x1=n=>n.toString(16);
let L='uz',OPS=[],ST=[],W=[],I=0,timer=null;
try{L=localStorage.getItem('aesL')||'uz'}catch(e){}
if(!T[L])L='uz';
const t=(k,...a)=>{let s=(T[L]&&T[L][k])||T.en[k]||k;a.forEach((v,i)=>s=s.split('{'+i+'}').join(v));return s};

const mat=(a,hl=[],dn)=>`<div class="mx">${[0,1,2,3].map(r=>[0,1,2,3].map(c=>{const k=r+4*c,p=dn&&!dn(k);return `<i class="${hl.includes(k)?'h':''}${p?' p':''}">${p?'··':h2(a[k])}</i>`}).join('')).join('')}</div>`;
const col=(c,m)=>`<div class="col"><small>${c}</small>${m}</div>`;
const rk=r=>W.slice(4*r,4*r+4).flat();

function sboxTable(hl){
  const d=[...Array(16).keys()];
  return `<div class="sw"><table class="sb"><tr><th></th>${d.map(i=>`<th>${x1(i)}</th>`).join('')}</tr>${d.map(r=>`<tr><th>${x1(r)}</th>${d.map(c=>`<td class="${hl.has(r*16+c)?'u':''}">${h2(S[r*16+c])}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
function keyWord(i){
  if(i<4)return t('kw0',i,hx(W[i]));
  const p=W[i-1],q=W[i-4];
  if(i%4===0){
    const rw=[p[1],p[2],p[3],p[0]],sw=rw.map(b=>S[b]),rc=rcon[i/4-1],x=[sw[0]^rc,sw[1],sw[2],sw[3]];
    return `w${i} = w${i-4} ⊕ g(w${i-1})\n  w${i-1}  = ${hx(p)}\n  RotWord = ${hx(rw)}\n  SubWord = ${hx(sw)}\n  ⊕ Rcon(${h2(rc)} 00 00 00) = ${hx(x)}\n  ⊕ w${i-4} (${hx(q)})\n  w${i}  = ${hx(W[i])}`;
  }
  return `w${i} = w${i-1} ⊕ w${i-4}\n  ${hx(p)} ⊕ ${hx(q)} = ${hx(W[i])}`;
}
// returns [flow html, detail html] for part j of operation o
function parts(o,j){
  const k=o.k;
  if(k==='load')return [col(t('state'),mat(o.a)),''];
  if(k==='sub'){
    const b=o.b[j],v=o.a[j],iv=inv(b),sh=[1,2,3,4].map(n=>rot(iv,n));
    return [col(t('before'),mat(o.b,[j]))+'<b>➜</b>'+col(t('after'),mat(o.a,[j],x=>x<=j)),
      `<h3>${t('byte')} ${j+1}/16: ${h2(b)} → ${h2(v)}</h3><pre>${t('lookup',x1(b>>4),x1(b&15),h2(v))}\n\n${t('how')}\n1) ${b?t('inv',h2(b),h2(iv)):t('inv0')}\n2) ${t('aff')}: ${[iv,...sh].map(h2).join(' ⊕ ')} ⊕ 63 = ${h2(v)}</pre><h3 style="margin-top:14px">${t('sbt')}</h3>${sboxTable(new Set([b]))}`];
  }
  if(k==='shift'){
    const row=a=>[0,1,2,3].map(c=>h2(a[j+4*c])).join(' '),hl=[0,1,2,3].map(c=>j+4*c);
    return [col(t('before'),mat(o.b,hl))+'<b>➜</b>'+col(t('after'),mat(o.a,hl,x=>(x&3)<=j)),
      `<h3>${t('row',j)}: ${j?t('shl',j):t('noshift')}</h3><pre>${row(o.b)}   ← ${j} →   ${row(o.a)}\n\nnew[${j}][c] = old[${j}][(c+${j}) mod 4]</pre>`];
  }
  if(k==='mix'){
    const c=j,a=[0,1,2,3].map(q=>o.b[4*c+q]),hl=[0,1,2,3].map(q=>4*c+q);
    const A=a.map((v,q)=>{const x=xt(v);return `a${q} = ${h2(v)} (${bin(v)})\n  02·a${q}: ${bin((v<<1)&255)}${v&128?' ⊕ 00011011':''} = ${h2(x)}\n  03·a${q}: ${h2(x)} ⊕ ${h2(v)} = ${h2(x^v)}`}).join('\n');
    const B=[0,1,2,3].map(r=>`b${r} = ${MM[r].map((m,q)=>`0${m}·a${q}`).join(' ⊕ ')}\n   = ${MM[r].map((m,q)=>h2(mul(a[q],m))).join(' ⊕ ')} = ${h2(o.a[4*c+r])}`).join('\n\n');
    return [col(t('before'),mat(o.b,hl))+'<b>➜</b>'+col(t('after'),mat(o.a,hl,x=>(x>>2)<=j)),
      `<h3>${t('col',c)}</h3><pre>${A}</pre><p class="ex" style="margin:10px 0">${t('mixn')}</p><pre>${B}</pre>`];
  }
  if(k==='key'){
    const r=o.r,hl=[0,1,2,3].map(q=>4*j+q),dn=x=>(x>>2)<=j;
    return [(r?col(t('rk',r-1),mat(rk(r-1)))+'<b>➜</b>':'')+col(t('rk',r),mat(rk(r),hl,dn)),
      `<h3>${t('word',4*r+j)} (${j+1}/4)</h3><pre>${keyWord(4*r+j)}</pre>`];
  }
  const key=rk(o.r),x=o.b[j],y=key[j],z=o.a[j];
  return [col(t('state'),mat(o.b,[j]))+'<b>⊕</b>'+col(t('rk',o.r),mat(key,[j]))+'<b>=</b>'+col(t('res'),mat(o.a,[j],q=>q<=j)),
    `<h3>${t('byte')} ${j+1}/16</h3><pre>${bin(x)}  (${h2(x)}, ${t('state')})\n${bin(y)}  (${h2(y)}, ${t('kl')})  ⊕\n--------\n${bin(z)}  (${h2(z)}, ${t('res')})</pre>`];
}
const st=q=>ST.findIndex(s=>s[0]===q);
function render(){
  const [oi,j]=ST[I],o=OPS[oi],[flow,det]=parts(o,j);
  const ttl=o.k==='load'?t('inp'):`${t('rnd',o.r)} · <em>${t(o.k)}</em>`;
  let end='';
  if(I===ST.length-1){
    const ct=o.a.map(h2).join('');
    end=`<div class="det"><h3>${t('ct')}</h3><pre>${ct}</pre>${ct==='3925841d02dc09fbdc118597196a0b32'&&$('pt').value.trim().toLowerCase()==='3243f6a8885a308d313198a2e0370734'?`<p class="ok">${t('ok')}</p>`:''}</div>`;
  }
  $('step').innerHTML=`<div class="ttl">${ttl}<span>${t('stp')} ${I+1}/${ST.length}${o.n>1?` · ${t('part')} ${j+1}/${o.n}`:''}</span></div><p class="ex">${t('ex_'+o.k)}</p><div class="flow">${flow}</div><div class="det">${det}</div>${end}`;
  $('sl').value=I;
  const first=r=>ST.findIndex(([q])=>OPS[q].r===r&&OPS[q].k!=='load');
  $('chips').innerHTML=`<button class="${o.k==='load'?'on':''}" onclick="go(0)">${t('inp')}</button>`+[...Array(11).keys()].map(r=>`<button title="${t('rnd',r)}" class="${o.k!=='load'&&o.r===r?'on':''}" onclick="go(${first(r)})">${r}</button>`).join('');
  $('ops').innerHTML=o.k==='load'?'':OPS.map((p,q)=>p.r===o.r&&p.k!=='load'?`<button class="${q===oi?'on':''}" onclick="go(${st(q)})">${t(p.k)}</button>`:'').join('');
}
function go(i){I=Math.max(0,Math.min(ST.length-1,i));render()}
function jump(d){const [oi,j]=ST[I];go(d>0?(oi+1<OPS.length?st(oi+1):I):(j>0?st(oi):(oi>0?st(oi-1):0)))}
function pad(v){
  v=v.trim();
  if(/^[0-9a-f]{32}$/i.test(v))return Uint8Array.from(v.match(/../g),x=>parseInt(x,16));
  const e=new TextEncoder().encode(v);if(!e.length||e.length>16)throw new Error('len');
  const o=new Uint8Array(16);o.set(e);return o;
}
function start(keep){
  $('err').textContent='';stop();
  try{
    const p=pad($('pt').value),k=pad($('key').value);
    $('info').textContent=t('ptl')+': '+Array.from(p,h2).join('')+'\n'+t('kl')+': '+Array.from(k,h2).join('');
    const r=build(p,k);OPS=r.ops;W=r.w;ST=[];
    OPS.forEach((o,q)=>{for(let j=0;j<o.n;j++)ST.push([q,j])});
    I=Math.min(keep||0,ST.length-1);$('sl').max=ST.length-1;$('app').hidden=false;render();
  }catch(e){$('err').textContent=t('err');$('app').hidden=true}
}
function stop(){if(timer){clearInterval(timer);timer=null}$('pl').textContent=t('auto')}
function setLang(l){
  L=l;try{localStorage.setItem('aesL',l)}catch(e){}
  document.documentElement.lang=l;document.title=t('title');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  if(!$('app').hidden)start(I);else $('pl').textContent=t('auto');
}
$('go').onclick=()=>start();
$('exb').onclick=()=>{$('pt').value='3243f6a8885a308d313198a2e0370734';$('key').value='2b7e151628aed2a6abf7158809cf4f3c';start()};
$('pv').onclick=()=>{stop();go(I-1)};$('nx').onclick=()=>{stop();go(I+1)};
$('po').onclick=()=>{stop();jump(-1)};$('no').onclick=()=>{stop();jump(1)};
$('sl').oninput=e=>{stop();go(+e.target.value)};
$('pl').onclick=()=>{if(timer)return stop();$('pl').textContent=t('stop');if(I>=ST.length-1)go(0);timer=setInterval(()=>{if(I>=ST.length-1)return stop();go(I+1)},+$('sp').value)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||!ST.length)return;if(e.key==='ArrowRight'){stop();go(I+1)}if(e.key==='ArrowLeft'){stop();go(I-1)}});
setLang(L);$('exb').click();
</script>
