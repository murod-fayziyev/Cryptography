<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AES — bosqichma-bosqich</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8ecf8;background:radial-gradient(900px 500px at 15% -10%,#1d2a63 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#0e4a52 0,transparent 55%),#0a0f1f}
.wrap{max-width:900px;margin:0 auto;padding:24px 14px 48px}
h1{margin:0;text-align:center;font-size:clamp(26px,5vw,40px);letter-spacing:-1px}
h1 span{background:linear-gradient(90deg,#6ee7b7,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:#9aa6c8;margin:8px 0 20px}
.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;color:#9aa6c8;margin:10px 0 6px}
input{width:100%;background:#0d1530;color:#e8ecf8;border:1px solid #27345f;border-radius:10px;padding:10px 12px;font:14px ui-monospace,Consolas,monospace;outline:none}
input:focus{border-color:#60a5fa}
button{cursor:pointer;border:1px solid #27345f;background:#111b3b;color:#e8ecf8;border-radius:10px;padding:9px 14px;font:inherit}
button:hover{border-color:#60a5fa}button.on{background:#1d2f6b;border-color:#60a5fa}
.go{background:linear-gradient(90deg,#34d399,#60a5fa);color:#06101f;font-weight:700;border:0}
.inl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
small{display:block;color:#7f8cb0;margin-top:6px;font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.err{color:#fca5a5;margin-top:8px}.ok{color:#6ee7b7}
.bar{position:sticky;top:0;z-index:5;background:rgba(10,15,31,.92);backdrop-filter:blur(8px);padding:10px 0;margin-bottom:10px}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.chips button{padding:4px 9px;font-size:12px}
input[type=range]{padding:0;flex:1;min-width:120px;accent-color:#60a5fa}
.ttl{font-size:22px;font-weight:700}.ttl em{font-style:normal;color:#6ee7b7}.ttl span{font-size:13px;color:#7f8cb0;font-weight:400;margin-left:8px}
.ex{color:#c3cce6;line-height:1.55;margin:8px 0 14px}
.flow{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.flow b{font-size:26px;color:#60a5fa}
.col small{text-align:center;font-family:inherit;margin:0 0 6px}
.mx{display:grid;grid-template-columns:repeat(4,46px);gap:4px}
.mx i{font:15px ui-monospace,Consolas,monospace;font-style:normal;text-align:center;background:#16224a;border-radius:7px;padding:8px 0}
.mx i.h{background:#0f766e;color:#fff;box-shadow:0 0 0 1px #6ee7b7 inset}
.det{margin-top:16px;border-top:1px solid rgba(255,255,255,.1);padding-top:14px}
.det h3{margin:0 0 10px;font-size:15px;color:#9aa6c8}
pre{margin:0;background:#0d1530;border:1px solid #27345f;border-radius:10px;padding:12px;font:13px/1.55 ui-monospace,Consolas,monospace;overflow-x:auto;color:#d5dcf2}
.lk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lk i{font-style:normal;background:#16224a;border-radius:8px;padding:6px;text-align:center;font:14px ui-monospace,Consolas,monospace}
.lk i s{display:block;text-decoration:none;font-size:10px;color:#7f8cb0}
.sw{overflow-x:auto;margin-top:12px}
table.sb{border-collapse:collapse;font:11px ui-monospace,Consolas,monospace}
.sb th{color:#6ee7b7;padding:3px 5px}.sb td{padding:3px 5px;text-align:center;color:#8e9bc0;border:1px solid #1b2750}
.sb td.u{background:#0f766e;color:#fff;font-weight:700}
details summary{cursor:pointer;color:#9aa6c8;font-size:14px}
footer{text-align:center;color:#6b7799;font-size:12px;margin-top:18px}
@media(max-width:520px){.mx{grid-template-columns:repeat(4,38px)}.mx i{font-size:13px;padding:6px 0}}
</style>
</head>
<body>
<div class="wrap">
<h1>AES <span>bosqichma-bosqich</span></h1>
<p class="sub">AES-128 shifrlashining har bir amalini alohida ko'ring: SubBytes, ShiftRows, MixColumns, AddRoundKey va kalit kengaytirish.</p>

<div class="card">
  <label>Ochiq matn (16 ta belgi yoki 32 ta hex)</label>
  <input id="pt" spellcheck="false" autocomplete="off">
  <label>Kalit (16 ta belgi yoki 32 ta hex)</label>
  <input id="key" spellcheck="false" autocomplete="off">
  <small id="info"></small>
  <div class="inl"><button class="go" id="go">Boshlash</button><button id="ex">FIPS-197 namunasi</button></div>
  <div class="err" id="err"></div>
</div>

<div id="app" hidden>
  <div class="bar">
    <div class="inl" style="margin:0">
      <button id="pv">◀</button><button id="nx">▶</button><button id="pl">▶ Avto</button>
      <input type="range" id="sl" min="0" value="0">
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="card" id="step"></div>
</div>
<footer>O'quv vositasi · hammasi brauzeringizda ishlaydi · tugmalar: ← →</footer>
</div>

<script>
// CORE-START
const xt=a=>((a<<1)^((a&0x80)?0x1b:0))&255;
const mul=(a,b)=>{let r=0;while(b){if(b&1)r^=a;a=xt(a);b>>=1}return r};
const rot=(x,n)=>((x<<n)|(x>>(8-n)))&255;
const S=new Uint8Array(256);
for(let x=0;x<256;x++){let v=0;if(x)for(let y=1;y<256;y++)if(mul(x,y)===1){v=y;break}
  S[x]=v^rot(v,1)^rot(v,2)^rot(v,3)^rot(v,4)^0x63}
const rcon=[1,2,4,8,16,32,64,128,0x1b,0x36];
const MM=[[2,3,1,1],[1,2,3,1],[1,1,2,3],[3,1,1,2]];
const add=(s,k)=>s.map((b,i)=>b^k[i]);
function shift(s){const o=new Array(16);for(let r=0;r<4;r++)for(let c=0;c<4;c++)o[r+4*c]=s[r+4*((c+r)%4)];return o}
function mix(s){const o=new Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let v=0;for(let k=0;k<4;k++)v^=mul(s[4*c+k],MM[r][k]);o[4*c+r]=v}return o}
function kexp(key){const w=[];for(let i=0;i<4;i++)w.push(Array.from(key.slice(4*i,4*i+4)));
  for(let i=4;i<44;i++){let t=w[i-1].slice();if(i%4===0){t=[S[t[1]],S[t[2]],S[t[3]],S[t[0]]];t[0]^=rcon[i/4-1]}w.push(t.map((b,j)=>b^w[i-4][j]))}return w}
function build(pt,key){
  const w=kexp(key),rk=r=>w.slice(4*r,4*r+4).flat(),st=[];let s=Array.from(pt),n;
  st.push({k:'load',r:0,b:s,a:s});
  n=add(s,rk(0));st.push({k:'ark',r:0,b:s,a:n});s=n;
  for(let r=1;r<=10;r++){
    n=s.map(b=>S[b]);st.push({k:'sub',r,b:s,a:n});s=n;
    n=shift(s);st.push({k:'shift',r,b:s,a:n});s=n;
    if(r<10){n=mix(s);st.push({k:'mix',r,b:s,a:n});s=n}
    n=add(s,rk(r));st.push({k:'ark',r,b:s,a:n});s=n;
  }
  return {st,w};
}
// CORE-END

const $=id=>document.getElementById(id);
const h2=b=>b.toString(16).padStart(2,'0'),hx=a=>a.map(h2).join(' '),bin=b=>b.toString(2).padStart(8,'0');
let ST=[],W=[],I=0,mc=0,timer=null;

const NAMES={load:'Kirish',sub:'SubBytes',shift:'ShiftRows',mix:'MixColumns',ark:'AddRoundKey'};
const EXPL={
 load:"Ochiq matnning 16 bayti 4×4 jadvalga USTUN bo'yicha joylanadi (yuqoridan pastga, so'ng keyingi ustun). Bu jadval «holat» (state) deyiladi. AES shu jadvalni 10 raund davomida o'zgartiradi.",
 ark:"Holatning har bir baytiga raund kalitining mos baytini XOR (⊕) qilamiz. XOR: bitlar bir xil bo'lsa 0, har xil bo'lsa 1. Kalit shifrga aynan shu yerda qo'shiladi.",
 sub:"Har bir bayt S-box jadvalidagi qiymatga almashtiriladi: baytning 1-hex raqami — qator, 2-si — ustun. Bu AES'dagi yagona chiziqsiz qadam: kalit va shifrmatn orasidagi bog'lanishni murakkablashtiradi.",
 shift:"0-qator joyida qoladi, 1-qator 1 ta, 2-qator 2 ta, 3-qator 3 ta bayt chapga siljiydi. Shunda har bir ustundagi baytlar boshqa ustunlarga tarqaladi.",
 mix:"Har bir ustun GF(2⁸) maydonida qat'iy matritsaga ko'paytiriladi. Natijada ustundagi har bir bayt 4 ta baytga bog'liq bo'ladi (diffuziya). Oxirgi, 10-raundda bu qadam yo'q."
};

const mat=(a,hl=[])=>`<div class="mx">${[0,1,2,3].map(r=>[0,1,2,3].map(c=>{const k=r+4*c;return `<i class="${hl.includes(k)?'h':''}">${h2(a[k])}</i>`}).join('')).join('')}</div>`;
const col=(t,m)=>`<div class="col"><small>${t}</small>${m}</div>`;
const changed=(b,a)=>a.map((x,i)=>x!==b[i]?i:-1).filter(i=>i>=0);

function sboxTable(hl){
  const d=[...Array(16).keys()];
  return `<div class="sw"><table class="sb"><tr><th></th>${d.map(i=>`<th>${i.toString(16)}</th>`).join('')}</tr>${d.map(r=>`<tr><th>${r.toString(16)}</th>${d.map(c=>`<td class="${hl.has(r*16+c)?'u':''}">${h2(S[r*16+c])}</td>`).join('')}</tr>`).join('')}</table></div>`;
}
function keyDetail(r){
  const L=[];
  if(r===0){for(let i=0;i<4;i++)L.push(`w${i} = ${hx(W[i])}`);return "Kalitning o'zi 4 ta so'zga (word) bo'linadi:\n\n"+L.join('\n')}
  for(let i=4*r;i<4*r+4;i++){
    const p=W[i-1],q=W[i-4];
    if(i%4===0){
      const rw=[p[1],p[2],p[3],p[0]],sw=rw.map(b=>S[b]),rc=rcon[i/4-1],x=[sw[0]^rc,sw[1],sw[2],sw[3]];
      L.push(`w${i} = w${i-4} ⊕ g(w${i-1})   (har 4-so'zda maxsus g funksiyasi)\n  w${i-1}          = ${hx(p)}\n  RotWord (aylantir) = ${hx(rw)}\n  SubWord (S-box)    = ${hx(sw)}\n  ⊕ Rcon ${h2(rc)} 00 00 00 = ${hx(x)}\n  ⊕ w${i-4}          = ${hx(q)}\n  w${i}          = ${hx(W[i])}`);
    }else L.push(`w${i} = w${i-1} ⊕ w${i-4}\n  ${hx(p)} ⊕ ${hx(q)} = ${hx(W[i])}`);
  }
  return L.join('\n\n');
}
function detail(s){
  if(s.k==='load')return '';
  if(s.k==='ark'){
    const key=W.slice(4*s.r,4*s.r+4).flat();
    return `<h3>Hisob-kitob: holat ⊕ ${s.r}-raund kaliti</h3><pre>${bin(s.b[0])}  (${h2(s.b[0])}, holat)\n${bin(key[0])}  (${h2(key[0])}, kalit)  ⊕\n${'-'.repeat(8)}\n${bin(s.a[0])}  (${h2(s.a[0])}, natija)   ← 1-bayt misolida</pre>
    <details class="det" style="border:0;padding:0;margin-top:12px" open><summary>${s.r}-raund kaliti qanday hosil bo'ldi (Key Expansion)</summary><pre style="margin-top:10px">${keyDetail(s.r)}</pre></details>`;
  }
  if(s.k==='sub'){
    const used=new Set(s.b);
    return `<h3>Har bir bayt uchun S-box qidiruvi</h3><div class="lk">${s.b.map((b,k)=>`<i>${h2(b)} → ${h2(s.a[k])}<s>qator ${(b>>4).toString(16)} · ustun ${(b&15).toString(16)}</s></i>`).join('')}</div>
    <h3 style="margin-top:14px">S-box jadvali (ishlatilgan kataklar belgilangan)</h3>${sboxTable(used)}`;
  }
  if(s.k==='shift'){
    const row=(a,r)=>[0,1,2,3].map(c=>h2(a[r+4*c])).join(' ');
    return `<h3>Qatorlar bo'yicha siljish</h3><pre>${[0,1,2,3].map(r=>`${r}-qator:  ${row(s.b,r)}   ← ${r} ta chapga →   ${row(s.a,r)}`).join('\n')}</pre>`;
  }
  const c=mc,a=[0,1,2,3].map(k=>s.b[4*c+k]);
  return `<h3>Ustunni tanlang va hisobni ko'ring</h3><div class="inl" style="margin:0 0 10px">${[0,1,2,3].map(x=>`<button class="${x===c?'on':''}" onclick="mc=${x};render()">${x}-ustun</button>`).join('')}</div>
  <pre>${[0,1,2,3].map(r=>{const t=MM[r].map((m,k)=>mul(a[k],m));return `b${r} = ${MM[r].map((m,k)=>`0${m}·${h2(a[k])}`).join(' ⊕ ')}\n   = ${t.map(h2).join(' ⊕ ')}  =  ${h2(s.a[4*c+r])}`}).join('\n\n')}</pre>
  <p class="ex" style="margin:10px 0 0">Bu yerda «·» — GF(2⁸)dagi ko'paytirish: <b>02·a</b> = a ni 1 bit chapga siljitish (agar yuqori bit 1 bo'lsa, natijani 1b bilan XOR); <b>03·a</b> = 02·a ⊕ a; <b>01·a</b> = a.</p>`;
}
function render(){
  const s=ST[I],ch=changed(s.b,s.a);
  let flow;
  if(s.k==='load')flow=col('Holat (state)',mat(s.a));
  else if(s.k==='ark'){const key=W.slice(4*s.r,4*s.r+4).flat();flow=col('Holat',mat(s.b))+'<b>⊕</b>'+col(`${s.r}-raund kaliti`,mat(key))+'<b>=</b>'+col('Natija',mat(s.a,ch))}
  else flow=col('Oldin',mat(s.b,ch))+'<b>➜</b>'+col('Keyin',mat(s.a,ch));
  const ttl=s.k==='load'?'Kirish':`${s.r}-raund · <em>${NAMES[s.k]}</em>`;
  let end='';
  if(I===ST.length-1){
    const ct=s.a.map(h2).join('');
    end=`<div class="det"><h3>Tayyor shifrmatn (hex)</h3><pre>${ct}</pre>${ct==='3925841d02dc09fbdc118597196a0b32'&&$('pt').value.trim().toLowerCase()==='3243f6a8885a308d313198a2e0370734'?'<p class="ok">✓ FIPS-197 B ilovasidagi rasmiy natija bilan mos.</p>':''}</div>`;
  }
  $('step').innerHTML=`<div class="ttl">${ttl}<span>qadam ${I+1}/${ST.length}</span></div><p class="ex">${EXPL[s.k]}</p><div class="flow">${flow}</div><div class="det">${detail(s)}</div>${end}`;
  $('sl').value=I;
  $('chips').innerHTML=['Kirish',...Array.from({length:11},(_,r)=>`${r}-raund`)].map((t,r)=>{
    const idx=r===0?0:ST.findIndex(x=>x.r===r-1&&x.k!=='load');
    const on=r===0?I===0:(s.r===r-1&&s.k!=='load');
    return `<button class="${on?'on':''}" onclick="go(${idx})">${t}</button>`}).join('');
}
function go(i){I=Math.max(0,Math.min(ST.length-1,i));render()}
function pad(v){
  v=v.trim();
  if(/^[0-9a-f]{32}$/i.test(v))return Uint8Array.from(v.match(/../g),x=>parseInt(x,16));
  const e=new TextEncoder().encode(v);if(!e.length||e.length>16)throw new Error("16 ta belgi (bayt) yoki 32 ta hex kiriting.");
  const o=new Uint8Array(16);o.set(e);return o;
}
function start(){
  $('err').textContent='';stop();
  try{
    const p=pad($('pt').value),k=pad($('key').value);
    $('info').textContent='ochiq matn: '+Array.from(p,h2).join('')+'\nkalit: '+Array.from(k,h2).join('');
    $('info').style.whiteSpace='pre-wrap';
    const r=build(p,k);ST=r.st;W=r.w;I=0;mc=0;
    $('sl').max=ST.length-1;$('app').hidden=false;render();
  }catch(e){$('err').textContent=e.message;$('app').hidden=true}
}
function stop(){if(timer){clearInterval(timer);timer=null;$('pl').textContent='▶ Avto'}}
$('go').onclick=start;
$('ex').onclick=()=>{$('pt').value='3243f6a8885a308d313198a2e0370734';$('key').value='2b7e151628aed2a6abf7158809cf4f3c';start()};
$('pv').onclick=()=>{stop();go(I-1)};$('nx').onclick=()=>{stop();go(I+1)};
$('sl').oninput=e=>{stop();go(+e.target.value)};
$('pl').onclick=()=>{if(timer)return stop();$('pl').textContent='⏸ To\'xtat';if(I>=ST.length-1)go(0);timer=setInterval(()=>{if(I>=ST.length-1)return stop();go(I+1)},1100)};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;if(e.key==='ArrowRight'){stop();go(I+1)}if(e.key==='ArrowLeft'){stop();go(I-1)}});
$('ex').click();
</script>
</body>
</html>
