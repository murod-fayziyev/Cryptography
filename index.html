<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AES Visualizer & Cryptography Sandbox</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8ecf8;background:radial-gradient(900px 500px at 15% -10%,#1d2a63 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#0e4a52 0,transparent 55%),#0a0f1f}
.wrap{max-width:820px;margin:0 auto;padding:40px 16px 48px;position:relative}
.lang-switcher{display:flex;justify-content:flex-end;gap:6px;margin-bottom:20px}
.lang-switcher button{cursor:pointer;border:1px solid #27345f;background:#111b3b;color:#9aa6c8;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;transition:.2s}
.lang-switcher button:hover{border-color:#60a5fa;color:#e8ecf8}
.lang-switcher button.on{background:#1d2f6b;border-color:#60a5fa;color:#fff}
h1{margin:0;text-align:center;font-size:clamp(32px,7vw,50px);letter-spacing:-1.5px}
h1 span{background:linear-gradient(90deg,#6ee7b7,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:#9aa6c8;margin:12px 0 32px;line-height:1.6}
a.card{display:block;text-decoration:none;color:inherit;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:22px;margin-bottom:16px;transition:.2s}
a.card:hover{border-color:#60a5fa;transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,0.35)}
a.card b{display:block;font-size:19px;margin-bottom:6px;color:#f0f4ff}
a.card span{color:#b3bdd9;line-height:1.55;font-size:15px}
a.card em{font-style:normal;color:#6ee7b7;font-size:12px;display:block;margin-top:10px;font-weight:600}
footer{text-align:center;color:#6b7799;font-size:12px;margin-top:34px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="lang-switcher">
    <button data-l="uz" class="on">UZ</button>
    <button data-l="en">EN</button>
    <button data-l="ru">RU</button>
  </div>

  <h1>AES <span>Visualizer</span></h1>
  <p class="sub" id="sub"></p>

  <a class="card" href="simple.html">
    <b id="c1_title"></b>
    <span id="c1_desc"></span>
    <em id="c1_badge"></em>
  </a>

  <a class="card" href="steps.html">
    <b id="c2_title"></b>
    <span id="c2_desc"></span>
  </a>

  <a class="card" href="calculator.html">
    <b id="c3_title"></b>
    <span id="c3_desc"></span>
  </a>

  <footer id="foot"></footer>
</div>

<script>
const I18N = {
  uz: {
    sub: "AES-128 shifrlash algoritmini bosqichma-bosqich o'rganish uchun interaktiv vositalar to'plami.",
    c1_title: "1. Oddiy tushuntirish (Simple visualizer)",
    c1_desc: "Shifrlash va deshifrlash, barcha 10 ta raund, intuitiv matritsalar va oddiy tildagi izohlar.",
    c1_badge: "Tavsiya etiladi · Yangi o'rganuvchilar uchun",
    c2_title: "2. Chuqurlashtirilgan bosqichlar (Detailed steps)",
    c2_desc: "SubBytes, ShiftRows, MixColumns (GF(2⁸) ko'paytmasi) va kalit kengaytirishning (Key Expansion) to'liq matematik tahlili.",
    c3_title: "3. AES kalkulyatori (Full calculator)",
    c3_desc: "AES-128/192/256 turlari, ECB va CBC rejimlari, ixtiyoriy uzunlikdagi matnlarni shifrlash va deshifrlash.",
    foot: "Ta'lim maqsadida ishlab chiqilgan. Barcha hisoblashlar brauzeringizda xavfsiz bajariladi."
  },
  en: {
    sub: "Interactive tools and visualizers to master the Advanced Encryption Standard (AES) step by step.",
    c1_title: "1. Simple Explanation & Visualizer",
    c1_desc: "Step-by-step forward encryption and reverse decryption across all 10 rounds with clear visual intuition.",
    c1_badge: "Recommended · Best for Beginners",
    c2_title: "2. Deep-Dive Mathematical Steps",
    c2_desc: "Technical analysis of SubBytes, ShiftRows, Galois Field MixColumns math, and Key Expansion schedule.",
    c3_title: "3. Complete AES Calculator",
    c3_desc: "Full support for AES-128, 192, and 256-bit keys, ECB & CBC block modes with padding and hex inspection.",
    foot: "Designed for educational purposes. Runs completely client-side in your browser."
  },
  ru: {
    sub: "Интерактивные инструменты для пошагового изучения алгоритма шифрования AES (Rijndael).",
    c1_title: "1. Простое объяснение и визуализация",
    c1_desc: "Прямое шифрование и расшифрование, все 10 раундов, понятные подсказки и цветовое выделение изменений.",
    c1_badge: "Рекомендуется · Для быстрого старта",
    c2_title: "2. Детальный разбор раундов и математики",
    c2_desc: "Технический разбор SubBytes, ShiftRows, умножения в поле Галуа GF(2⁸) (MixColumns) и расширения ключей.",
    c3_title: "3. Полнофункциональный калькулятор AES",
    c3_desc: "Режимы AES-128/192/256, ECB и CBC, работа с текстом произвольной длины и шестнадцатеричным кодом.",
    foot: "Создано в образовательных целях. Все вычисления производятся локально в браузере."
  }
};

let currentLang = 'uz';

function setLang(l) {
  currentLang = l;
  document.documentElement.lang = l;
  document.querySelectorAll('.lang-switcher button').forEach(b => b.classList.toggle('on', b.dataset.l === l));
  const t = I18N[l];
  document.getElementById('sub').textContent = t.sub;
  document.getElementById('c1_title').textContent = t.c1_title;
  document.getElementById('c1_desc').textContent = t.c1_desc;
  document.getElementById('c1_badge').textContent = t.c1_badge;
  document.getElementById('c2_title').textContent = t.c2_title;
  document.getElementById('c2_desc').textContent = t.c2_desc;
  document.getElementById('c3_title').textContent = t.c3_title;
  document.getElementById('c3_desc').textContent = t.c3_desc;
  document.getElementById('foot').textContent = t.foot;
}

document.querySelectorAll('.lang-switcher button').forEach(b => {
  b.onclick = () => setLang(b.dataset.l);
});

setLang('uz');
</script>
</body>
</html>
