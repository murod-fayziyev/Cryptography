<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AES Visualizer & Calculator</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:#e8ecf8;
  background:radial-gradient(900px 500px at 15% -10%,#1d2a63 0,transparent 60%),
             radial-gradient(800px 500px at 100% 0,#0e4a52 0,transparent 55%),
             #0a0f1f;
}
.wrap{max-width:820px;margin:0 auto;padding:40px 16px 48px;position:relative}
.lang-bar{display:flex;justify-content:flex-end;gap:6px;margin-bottom:24px}
.lang-bar button{
  cursor:pointer;
  border:1px solid #27345f;
  background:#111b3b;
  color:#9aa6c8;
  border-radius:8px;
  padding:6px 14px;
  font-size:13px;
  font-weight:600;
  transition:.2s;
}
.lang-bar button:hover{border-color:#60a5fa;color:#e8ecf8}
.lang-bar button.on{background:#1d2f6b;border-color:#60a5fa;color:#fff}

h1{margin:0;text-align:center;font-size:clamp(32px,7vw,52px);letter-spacing:-1.5px}
h1 span{background:linear-gradient(90deg,#6ee7b7,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{text-align:center;color:#9aa6c8;margin:12px 0 34px;line-height:1.6}

.cards{display:flex;flex-direction:column;gap:16px}
a.card{
  display:block;
  text-decoration:none;
  color:inherit;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:22px 26px;
  transition:.2s cubic-bezier(.4,0,.2,1);
}
a.card:hover{
  border-color:#60a5fa;
  transform:translateY(-3px);
  background:rgba(255,255,255,.07);
  box-shadow:0 12px 30px rgba(0,0,0,.35);
}
a.card b{display:block;font-size:19px;margin-bottom:8px;color:#f0f4ff}
a.card span{color:#b3bdd9;line-height:1.55;font-size:15px}

footer{text-align:center;color:#6b7799;font-size:12px;margin-top:42px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="lang-bar">
    <button data-l="uz" class="on">UZ</button>
    <button data-l="en">EN</button>
    <button data-l="ru">RU</button>
  </div>

  <h1>AES <span>Visualizer</span></h1>
  <p class="sub" id="sub"></p>

  <div class="cards">
    <!-- 1-o'rinda: Kalkulyator -->
    <a class="card" href="calculator.html">
      <b id="c1_t"></b>
      <span id="c1_d"></span>
    </a>

    <!-- 2-o'rinda: Bosqichma-bosqich tahlil -->
    <a class="card" href="steps.html">
      <b id="c2_t"></b>
      <span id="c2_d"></span>
    </a>
  </div>

  <footer id="foot"></footer>
</div>

<script>
const T = {
  uz: {
    sub: "AES algoritmini hisoblash va bosqichma-bosqich tahlil qilish vositalari.",
    c1_t: "1. AES Kalkulyatori (Full Calculator)",
    c1_d: "AES-128/192/256 o'lchamlari, ECB va CBC rejimlari, ixtiyoriy matnlarni shifrlash va deshifrlash.",
    c2_t: "2. Bosqichma-bosqich tahlil (Detailed Steps)",
    c2_d: "SubBytes, ShiftRows, MixColumns (GF(2⁸) amallari) va kalit kengaytirishning (Key Expansion) to'liq tahlili.",
    foot: "O'quv maqsadida yaratilgan. Barcha hisoblashlar brauzeringizda xavfsiz bajariladi."
  },
  en: {
    sub: "Interactive tools to calculate and master the Advanced Encryption Standard (AES).",
    c1_t: "1. Complete AES Calculator",
    c1_d: "AES-128, 192, and 256 keys with ECB & CBC modes, padding options, and hex inspector.",
    c2_t: "2. Detailed Mathematical Steps",
    c2_d: "Technical breakdown of SubBytes, ShiftRows, MixColumns math, and Key Expansion schedule.",
    foot: "Designed for education. Runs 100% locally in your browser."
  },
  ru: {
    sub: "Интерактивные инструменты для расчета и пошагового анализа алгоритма AES.",
    c1_t: "1. Полнофункциональный калькулятор AES",
    c1_d: "Поддержка AES-128/192/256, режимов ECB и CBC, работа с текстом и шестнадцатеричным кодом.",
    c2_t: "2. Детальный разбор раундов и математики",
    c2_d: "Технический разбор SubBytes, ShiftRows, умножения в поле GF(2⁸) и расширения ключей.",
    foot: "Создано в образовательных целях. Все вычисления производятся локально в браузере."
  }
};

function setLang(l) {
  document.documentElement.lang = l;
  document.querySelectorAll('.lang-bar button').forEach(b => b.classList.toggle('on', b.dataset.l === l));
  const t = T[l];
  document.getElementById('sub').textContent = t.sub;
  document.getElementById('c1_t').textContent = t.c1_t;
  document.getElementById('c1_d').textContent = t.c1_d;
  document.getElementById('c2_t').textContent = t.c2_t;
  document.getElementById('c2_d').textContent = t.c2_d;
  document.getElementById('foot').textContent = t.foot;
}

document.querySelectorAll('.lang-bar button').forEach(b => {
  b.onclick = () => setLang(b.dataset.l);
});

setLang('uz');
</script>
</body>
</html>
